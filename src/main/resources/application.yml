server:
  port: 8080
  servlet:
    context-path: /order

spring:
  application:
    name: sun-moon-java-platform-order
  datasource:
    url: jdbc:postgresql://localhost:5432/order_service
    username: sunmoon
    password: sunmoon_dev_pw
  flyway:
    enabled: true
    # The table already exists on the deployed database, created by
    # the schema.sql this replaces. Baseline adopts it as V1 rather
    # than refusing to start on a non-empty schema.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sun-moon:
  order:
    # How long a placed order waits for a terminal to accept it before
    # it expires. Short by demo standards; a real store would tune it.
    accept-timeout: ${ORDER_ACCEPT_TIMEOUT:PT3M}
    accept-timeout-sweep: ${ORDER_ACCEPT_SWEEP:PT10S}
  events:
    # Publish order events to Redis so the Device Server can reach the
    # terminals. False falls back to logging them, which is what a
    # machine without Redis needs.
    redis: ${EVENTS_REDIS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      orderEvents:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  retry:
    instances:
      orderEvents:
        max-attempts: 3
        wait-duration: 200ms
